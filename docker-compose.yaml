services:

  chroma:
    image: chromadb/chroma:1.3.0
    container_name: chroma
    entrypoint: ["chroma", "run", "--host", "0.0.0.0", "--port", "${CHROMA_PORT}"]
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/${CHROMA_PORT}" ]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - chroma_data:/chroma/
    networks:
      - rag-network

  rag:
    build: .
    container_name: rag
    ports:
      - "${STREAMLIT_SERVER_PORT}:${STREAMLIT_SERVER_PORT}"
    env_file: .env
    volumes:
      - ./appconfig.yaml:/app/appconfig.yaml:ro
      - ./data:/app/data:ro
    depends_on:
      chroma:
        condition: service_healthy
        restart: true
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  chroma_data: